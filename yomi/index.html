<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>競技かるた 読みタイミング練習</title>

<style>
body {
    font-family: sans-serif;
    max-width: 900px;
    margin: 40px auto;
    padding: 20px;
}

h1 {
    text-align: center;
}

.timer-container {
    margin: 20px 0;
}

.label {
    margin-bottom: 5px;
    font-weight: bold;
}

/* 1秒あたり80px */
:root {
    --unit-width: 80px;
}

.track {
    position: relative;
    height: 40px;
    border: 2px solid #333;
    background: #f5f5f5;
}

.progress {
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;
    width: 0%;
    background: #4CAF50;
}

.tick {
    position: absolute;
    top: 0;
    width: 1px;
    height: 100%;
    background: #555;
    z-index: 2;
}

button {
    display: block;
    margin: 40px auto 0;
    font-size: 20px;
    padding: 12px 40px;
    cursor: pointer;
}

.status {
    text-align: center;
    margin-top: 20px;
    font-size: 20px;
    font-weight: bold;
}
</style>
</head>

<body>

<h1>競技かるた 読みタイミング練習</h1>

<div id="timers"></div>

<button id="startBtn">開始</button>

<div class="status" id="status">待機中</div>

<script>
const durations = [5, 3, 1, 6];
const timerArea = document.getElementById("timers");
const statusText = document.getElementById("status");

const bars = [];

durations.forEach((sec, index) => {

    const container = document.createElement("div");
    container.className = "timer-container";

    const label = document.createElement("div");
    label.className = "label";
    label.textContent = `${sec}秒`;

    const track = document.createElement("div");
    track.className = "track";

    track.style.width = `calc(${sec} * var(--unit-width))`;

    const progress = document.createElement("div");
    progress.className = "progress";

    track.appendChild(progress);

    for(let i=1; i<sec; i++) {
        const tick = document.createElement("div");
        tick.className = "tick";
        tick.style.left = `calc(${i} * var(--unit-width))`;
        track.appendChild(tick);
    }

    container.appendChild(label);
    container.appendChild(track);

    timerArea.appendChild(container);

    bars.push(progress);
});


function animateBar(bar, durationSec) {

    return new Promise(resolve => {

        const startTime = performance.now();

        function update(now) {

            const elapsed = (now - startTime) / 1000;
            const ratio = Math.min(elapsed / durationSec, 1);

            bar.style.width = (ratio * 100) + "%";

            if (ratio < 1) {
                requestAnimationFrame(update);
            } else {
                resolve();
            }
        }

        requestAnimationFrame(update);
    });
}

async function startSequence() {

    document.getElementById("startBtn").disabled = true;

    bars.forEach(bar => {
        bar.style.width = "0%";
    });

    for(let i=0; i<durations.length; i++) {

        statusText.textContent = `${durations[i]}秒タイマー実行中`;

        await animateBar(bars[i], durations[i]);
    }

    statusText.textContent = "終了";

    document.getElementById("startBtn").disabled = false;
}

document.getElementById("startBtn")
    .addEventListener("click", startSequence);
</script>

</body>
</html>
